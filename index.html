<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasha's Personal Site</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0A0A0A;
            color: #EEF4EC;
            font-family: 'Oswald', Impact, sans-serif;
            text-align: center;
        }
        .choose { max-width: 640px; width: 100%; background: #1A1A1A; border-left: 10px solid #D4AF37; padding: 48px 32px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
        h1 { font-size: 2.6em; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 12px; }
        p { color: #D5E3D9; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
        .row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        button {
            font-family: inherit;
            background: #D4AF37;
            color: #0E1A13;
            border: none;
            padding: 16px 40px;
            font-size: 1.2em;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            min-width: 200px;
            transition: transform .2s, background .25s;
        }
        button:hover { background: #E8C75A; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="choose" id="choose">
        <h1>Sasha</h1>
        <p>How are you visiting?</p>
        <div class="row">
            <button type="button" data-device="phone">Phone</button>
            <button type="button" data-device="computer">Computer</button>
        </div>
    </div>

    <script>
        // Entry page: pick a device, then open the site (site.html) adapted for it.
        (function () {
            function remembered() {
                try { return sessionStorage.getItem('device'); } catch (e) { return null; }
            }
            function remember(d) {
                try { sessionStorage.setItem('device', d); } catch (e) {}
            }

            // Phone on a wide screen: show the site inside a phone-sized frame so its mobile layout applies
            function phoneFrame() {
                document.body.style.cssText = 'display:block;padding:0;background:#0A0A0A';
                document.body.innerHTML = '<iframe src="site.html" title="Sasha\'s Personal Site" ' +
                    'style="display:block;margin:16px auto;width:420px;max-width:100%;height:calc(100vh - 32px);border:8px solid #1c1c1c;border-radius:28px;background:#000"></iframe>';
            }

            // Computer on a small screen: load the site with a desktop-width viewport
            function desktopOnSmall() {
                fetch('site.html').then(function (r) { return r.text(); }).then(function (html) {
                    html = html.replace(/<meta name="viewport"[^>]*>/i, '<meta name="viewport" content="width=1100">');
                    document.open();
                    document.write(html);
                    document.close();
                });
            }

            function go(device) {
                remember(device);
                var wide = window.innerWidth > 700;
                if (device === 'phone') { wide ? phoneFrame() : location.replace('site.html'); }
                else { wide ? location.replace('site.html') : desktopOnSmall(); }
            }

            // Inside the phone frame, or coming back from the game page: skip the question
            var back = document.referrer.indexOf('game.html') !== -1;
            if (window.top !== window.self) { location.replace('site.html'); return; }
            if (back && remembered()) { go(remembered()); return; }

            document.querySelectorAll('button[data-device]').forEach(function (b) {
                b.addEventListener('click', function () { go(b.dataset.device); });
            });
        })();
    </script>
</body>
</html>
